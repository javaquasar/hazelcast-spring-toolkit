plugins {
    id 'maven-publish'
    id 'signing'
}

def projectLocalProps = new Properties()
def projectLocalPropsFile = rootProject.file('gradle-local.properties')
if (projectLocalPropsFile.exists()) {
    projectLocalPropsFile.withInputStream { stream ->
        projectLocalProps.load(stream)
    }
}

allprojects {
    projectLocalProps.each { key, value ->
        def name = key.toString()
        if (!gradle.startParameter.projectProperties.containsKey(name) && !hasProperty(name)) {
            ext.set(name, value)
        }
    }

    group = findProperty('group')
    version = findProperty('releaseVersion') ?: findProperty('version')

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        if (System.getenv('CI') == 'true') {
            testLogging {
                events "failed"
                exceptionFormat "full"
            }
        }
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
        options.encoding = 'UTF-8'
    }
}

def publishedModules = [
        'toolkit-core',
        'toolkit-runtime',
        'toolkit-scan-api',
        'toolkit-scan-reflections',
        'toolkit-metrics-spring',
        'toolkit-spring-common',
        'toolkit-spring-boot2',
        'toolkit-spring-boot3',
        'toolkit-spring-boot4',
]

def publishedArtifactIds = [
        'toolkit-core'             : 'hazelcast-toolkit-core',
        'toolkit-runtime'          : 'hazelcast-toolkit-runtime',
        'toolkit-scan-api'         : 'hazelcast-toolkit-scan-api',
        'toolkit-scan-reflections' : 'hazelcast-toolkit-scan-reflections',
        'toolkit-metrics-spring'   : 'hazelcast-toolkit-metrics-spring',
        'toolkit-spring-common'    : 'hazelcast-toolkit-spring-common',
        'toolkit-spring-boot2'     : 'hazelcast-toolkit-spring-boot2',
        'toolkit-spring-boot3'     : 'hazelcast-toolkit-spring-boot3',
        'toolkit-spring-boot4'     : 'hazelcast-toolkit-spring-boot4',
]

// POM display names and descriptions for each published module.
// Kept in the root build so they are always available when the pom{} closure is evaluated,
// regardless of subproject script evaluation order.
def pomMeta = [
        'toolkit-core'          : [name: 'Hazelcast Toolkit Core',
                                   desc: 'Core annotations for Hazelcast compact serialization (@HzCompact) and IMap listener auto-registration (@HzIMapListener).'],
        'toolkit-scan-api'      : [name: 'Hazelcast Toolkit Scan API',
                                   desc: 'Pluggable ClassScanner abstraction used by the Hazelcast Toolkit runtime to find annotated types and subtypes.'],
        'toolkit-scan-reflections': [name: 'Hazelcast Toolkit Scan Reflections',
                                   desc: 'Reflections-backed ClassScanner implementation and compact-type scanning support for the Hazelcast Toolkit.'],
        'toolkit-runtime'       : [name: 'Hazelcast Toolkit Runtime',
                                   desc: 'Hazelcast client factory, compact serialization registration, client naming, and configuration customizer support.'],
        'toolkit-metrics-spring': [name: 'Hazelcast Toolkit Metrics Spring',
                                   desc: 'Micrometer binders for Hazelcast near-cache and Hibernate L2 metrics, plus a diagnostic REST controller.'],
        'toolkit-spring-common' : [name: 'Hazelcast Toolkit Spring Common',
                                   desc: 'Shared Spring integration components including the IMap listener auto-registrar.'],
        'toolkit-spring-boot2'  : [name: 'Hazelcast Toolkit Spring Boot 2 Starter',
                                   desc: 'Spring Boot 2 auto-configuration starter: compact serialization, IMap listener registration, JCache L2 cache, and Micrometer metrics.'],
        'toolkit-spring-boot3'  : [name: 'Hazelcast Toolkit Spring Boot 3 Starter',
                                    desc: 'Spring Boot 3 auto-configuration starter: compact serialization, IMap listener registration, JCache L2 cache, Hibernate L2, and Micrometer metrics.'],
        'toolkit-spring-boot4'  : [name: 'Hazelcast Toolkit Spring Boot 4 Starter',
                                    desc: 'Spring Boot 4 auto-configuration starter: compact serialization, IMap listener registration, JCache L2 cache, Hibernate L2, Actuator integration, and Micrometer metrics.'],
]

configure(subprojects.findAll { it.name in publishedModules }) { Project p ->
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = publishedArtifactIds[p.name] ?: p.name

                pom {
                    def meta = pomMeta[p.name]
                    name = meta?.name ?: p.name
                    description = meta?.desc ?: p.name
                    url = 'https://github.com/javaquasar/hazelcast-spring-toolkit'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'javaquasar'
                            name = 'javaquasar'
                            url = 'https://github.com/javaquasar'
                        }
                    }

                    scm {
                        url = 'https://github.com/javaquasar/hazelcast-spring-toolkit'
                        connection = 'scm:git:https://github.com/javaquasar/hazelcast-spring-toolkit.git'
                        developerConnection = 'scm:git:ssh://git@github.com:javaquasar/hazelcast-spring-toolkit.git'
                    }
                }
            }
        }

        // Local staging repository used to assemble the Central Portal bundle ZIP
        repositories {
            maven {
                name = "localStaging"
                url = p.layout.buildDirectory.dir("staging-repo")
            }
        }
    }

    signing {
        def key = p.findProperty("signingKey")
        def keyId = p.findProperty("signingKeyId")
        def pass = p.findProperty("signingPassword")
        def useGpgCmdFlag = p.findProperty("useGpgCmd")?.toString()?.toBoolean()
        required = useGpgCmdFlag || (key != null && pass != null)
        if (useGpgCmdFlag) {
            useGpgCmd()
        } else if (key && pass) {
            def normalizedKey = key.toString()
                    .replace('\\r\\n', '\r\n')
                    .replace('\\n', '\n')
            if (keyId) {
                useInMemoryPgpKeys(keyId.toString(), normalizedKey, pass.toString())
            } else {
                useInMemoryPgpKeys(normalizedKey, pass.toString())
            }
        }
        sign publishing.publications.mavenJava
    }

    // ZIP bundle ready for upload to the Central Portal
    p.tasks.register("centralBundleZip", Zip) {
        dependsOn p.tasks.named("publishMavenJavaPublicationToLocalStagingRepository")
        from(p.layout.buildDirectory.dir("staging-repo"))
        archiveFileName = "${p.name}-${p.version}-central-bundle.zip"
        destinationDirectory = p.layout.buildDirectory.dir("central")
    }
}

// Root helper task that builds bundle ZIPs for all published modules
tasks.register("centralBundleAll") {
    dependsOn publishedModules.collect { ":${it}:centralBundleZip" }
}

// Single Central Portal bundle that contains every published module in one deployment.
tasks.register("centralBundleAggregate", Zip) {
    dependsOn publishedModules.collect { ":${it}:publishMavenJavaPublicationToLocalStagingRepository" }
    publishedModules.each { moduleName ->
        from(project(":${moduleName}").layout.buildDirectory.dir("staging-repo"))
    }
    archiveFileName = "${rootProject.name}-${version}-central-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir("central")
}

// Collect all generated Central Portal bundle ZIPs into a single root-level directory
tasks.register("collectCentralBundles", Copy) {
    dependsOn tasks.named("centralBundleAll")
    into layout.buildDirectory.dir("central-bundles")
    publishedModules.each { moduleName ->
        from(project(":${moduleName}").layout.buildDirectory.dir("central")) {
            include "*-central-bundle.zip"
        }
    }
    doFirst {
        delete layout.buildDirectory.dir("central-bundles")
    }
}

tasks.register("collectCentralAggregateBundle", Copy) {
    dependsOn tasks.named("centralBundleAggregate")
    from(layout.buildDirectory.dir("central")) {
        include "${rootProject.name}-*-central-bundle.zip"
    }
    into layout.buildDirectory.dir("central-bundles")
}
