name: Hazelcast Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/hazelcast-compatibility.yml"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "toolkit-*/**"
      - "example-*/**"

permissions:
  contents: read

jobs:
  hazelcast-compatibility:
    name: Hazelcast 5.7 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run starter compatibility tests
        run: >
          ./gradlew
          :toolkit-runtime:test
          :toolkit-spring-boot2:test
          :toolkit-spring-boot3:test
          :toolkit-spring-boot4:test
          -PhazelcastVersion=5.7.0

      - name: Print failed tests
        if: failure()
        shell: bash
        run: |
          find . -path "*/build/test-results/test/*.xml" -print0 \
            | xargs -0 grep -H -E "<failure|<error" \
            || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hazelcast-5.7.0-test-reports
          path: |
            **/build/reports/tests/**/*.html
            **/build/reports/tests/**/*.css
            **/build/reports/tests/**/*.js
            **/build/test-results/**/*.xml
            **/build/test-results/**/*.bin
            **/build/test-results/**/*.idx
          if-no-files-found: warn
