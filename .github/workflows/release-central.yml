name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.3.0
        required: true
        type: string
      publishing_type:
        description: Central Portal publishing mode
        required: true
        default: USER_MANAGED
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build and upload Central bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            PUBLISHING_TYPE="${{ inputs.publishing_type }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISHING_TYPE="USER_MANAGED"
          fi

          if [[ -z "${VERSION}" || "${VERSION}" == *"-SNAPSHOT" ]]; then
            echo "Release version must be a non-SNAPSHOT version." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "publishing_type=${PUBLISHING_TYPE}" >> "${GITHUB_OUTPUT}"

      - name: Check Docker
        run: docker info

      - name: Run release integration tests
        run: ./gradlew :toolkit-runtime:test :toolkit-spring-boot2:test :toolkit-spring-boot3:test :toolkit-spring-boot4:test :example-spring-boot3:test -PreleaseVersion=${{ steps.release.outputs.version }}

      - name: Build signed Central bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew clean collectCentralAggregateBundle -PreleaseVersion=${{ steps.release.outputs.version }}

      - name: Upload Central bundle
        id: upload
        shell: bash
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PUBLISHING_TYPE: ${{ steps.release.outputs.publishing_type }}
        run: |
          BUNDLE="build/central-bundles/hazelcast-toolkit-${RELEASE_VERSION}-central-bundle.zip"
          if [[ ! -f "${BUNDLE}" ]]; then
            echo "Central bundle not found: ${BUNDLE}" >&2
            exit 1
          fi

          TOKEN="$(printf '%s:%s' "${CENTRAL_PORTAL_USERNAME}" "${CENTRAL_PORTAL_PASSWORD}" | base64 -w 0)"
          DEPLOYMENT_ID="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --form "bundle=@${BUNDLE}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=hazelcast-toolkit-${RELEASE_VERSION}&publishingType=${PUBLISHING_TYPE}")"

          echo "deployment_id=${DEPLOYMENT_ID}" >> "${GITHUB_OUTPUT}"
          echo "Uploaded Central deployment: ${DEPLOYMENT_ID}"

      - name: Save Central bundle
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ steps.release.outputs.version }}
          path: build/central-bundles/*.zip

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports-${{ steps.release.outputs.version }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

      - name: Print follow-up
        run: |
          echo "Central deployment id: ${{ steps.upload.outputs.deployment_id }}"
          echo "Publishing type: ${{ steps.release.outputs.publishing_type }}"
          echo "For USER_MANAGED releases, open https://central.sonatype.com/publishing and publish after validation succeeds."
