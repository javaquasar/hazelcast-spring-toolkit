name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      publishing_type:
        description: Central Portal publishing mode
        required: true
        default: USER_MANAGED
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
      dry_run:
        description: Build and verify without uploading to Central Portal
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release_validation:
    name: Validate release request and documentation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      notes_file: ${{ steps.release.outputs.notes_file }}
      publishing_type: ${{ steps.release.outputs.publishing_type }}
      dry_run: ${{ steps.release.outputs.dry_run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve release inputs
        id: release
        shell: bash
        env:
          INPUT_PUBLISHING_TYPE: ${{ inputs.publishing_type }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            PUBLISHING_TYPE="${INPUT_PUBLISHING_TYPE}"
            DRY_RUN="${INPUT_DRY_RUN}"
          else
            PUBLISHING_TYPE="USER_MANAGED"
            DRY_RUN="false"
          fi

          VERSION="$(node scripts/resolve-release-version.mjs "${GITHUB_EVENT_NAME}" "${GITHUB_REF_NAME}")"
          TAG="v${VERSION}"
          TITLE="Hazelcast Toolkit ${TAG}"
          NOTES_FILE="docs/releases/${TAG}.md"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "title=${TITLE}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"
          echo "publishing_type=${PUBLISHING_TYPE}" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${DRY_RUN}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Release configuration"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| GitHub Release | ${TITLE} |"
            echo "| Release notes | \`${NOTES_FILE}\` |"
            echo "| Publishing type | \`${PUBLISHING_TYPE}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate release documentation
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --test scripts/*.test.mjs
          node scripts/validate-release-notes.mjs "${RELEASE_VERSION}"

  release:
    name: Build and upload Central bundle
    needs: release_validation
    runs-on: ubuntu-latest
    environment: maven-central

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check release secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          test -n "${SIGNING_KEY}" || { echo "SIGNING_KEY is not configured." >&2; exit 1; }
          test -n "${SIGNING_KEY_ID}" || { echo "SIGNING_KEY_ID is not configured." >&2; exit 1; }
          test -n "${SIGNING_PASSWORD}" || { echo "SIGNING_PASSWORD is not configured." >&2; exit 1; }
          test -n "${CENTRAL_PORTAL_USERNAME}" || { echo "CENTRAL_PORTAL_USERNAME is not configured." >&2; exit 1; }
          test -n "${CENTRAL_PORTAL_PASSWORD}" || { echo "CENTRAL_PORTAL_PASSWORD is not configured." >&2; exit 1; }

      - name: Resolve signing key ids
        id: signing
        shell: bash
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          SIGNING_KEY_ID="$(echo "${SIGNING_KEY_ID}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          SIGNING_KEY_ID="${SIGNING_KEY_ID#0X}"

          if [[ ! "${SIGNING_KEY_ID}" =~ ^[0-9A-F]{16}$ ]]; then
            echo "SIGNING_KEY_ID must be the 16-character signing subkey id, for example 50C2783D878EDB17." >&2
            exit 1
          fi

          echo "full_key_id=${SIGNING_KEY_ID}" >> "${GITHUB_OUTPUT}"
          echo "gradle_key_id=${SIGNING_KEY_ID:8:8}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Check Docker
        run: docker info

      - name: Run release integration tests
        run: ./gradlew :toolkit-runtime:test :toolkit-spring-boot2:test :toolkit-spring-boot3:test :toolkit-spring-boot4:test :example-spring-boot3:test -PreleaseVersion=${{ needs.release_validation.outputs.version }}

      - name: Build signed Central bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ steps.signing.outputs.gradle_key_id }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew clean collectCentralAggregateBundle -PreleaseVersion=${{ needs.release_validation.outputs.version }} --stacktrace

      - name: Verify signed Central bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release_validation.outputs.version }}
          SIGNING_KEY_ID: ${{ steps.signing.outputs.full_key_id }}
        run: |
          BUNDLE="build/central-bundles/hazelcast-toolkit-${RELEASE_VERSION}-central-bundle.zip"
          if [[ ! -s "${BUNDLE}" ]]; then
            echo "Central bundle not found or empty: ${BUNDLE}" >&2
            exit 1
          fi

          ASC_COUNT="$(find . -path "*/build/staging-repo/*" -name "*.asc" | wc -l)"
          if [[ "${ASC_COUNT}" -eq 0 ]]; then
            echo "No signature files were generated. Check SIGNING_KEY and SIGNING_PASSWORD." >&2
            exit 1
          fi

          unzip -l "${BUNDLE}" | grep -q '\.asc$' || {
            echo "Central bundle does not contain signature files." >&2
            exit 1
          }

          EXPECTED_SIGNING_KEY_ID="$(echo "${SIGNING_KEY_ID}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          find . -path "*/build/staging-repo/*" -name "*.asc" -print0 \
            | xargs -0 -I{} sh -c '
                gpg --list-packets "$1" | grep -q "keyid '"${EXPECTED_SIGNING_KEY_ID}"'" || {
                  echo "Signature $1 was not made by expected signing key '"${EXPECTED_SIGNING_KEY_ID}"'." >&2
                  exit 1
                }
              ' sh {}

      - name: Upload Central bundle
        if: needs.release_validation.outputs.dry_run != 'true'
        id: upload
        shell: bash
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          RELEASE_VERSION: ${{ needs.release_validation.outputs.version }}
          PUBLISHING_TYPE: ${{ needs.release_validation.outputs.publishing_type }}
        run: |
          BUNDLE="build/central-bundles/hazelcast-toolkit-${RELEASE_VERSION}-central-bundle.zip"
          if [[ ! -f "${BUNDLE}" ]]; then
            echo "Central bundle not found: ${BUNDLE}" >&2
            exit 1
          fi

          TOKEN="$(printf '%s:%s' "${CENTRAL_PORTAL_USERNAME}" "${CENTRAL_PORTAL_PASSWORD}" | base64 -w 0)"
          DEPLOYMENT_ID="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --form "bundle=@${BUNDLE}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=hazelcast-toolkit-${RELEASE_VERSION}&publishingType=${PUBLISHING_TYPE}")"

          echo "deployment_id=${DEPLOYMENT_ID}" >> "${GITHUB_OUTPUT}"
          echo "Uploaded Central deployment: ${DEPLOYMENT_ID}"

      - name: Save Central bundle
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle-${{ needs.release_validation.outputs.version }}
          path: build/central-bundles/*.zip

      - name: Print failed tests
        if: failure()
        shell: bash
        run: |
          find . -path "*/build/test-results/test/*.xml" -print0 \
            | xargs -0 grep -H -E "<failure|<error" \
            || true

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports-${{ needs.release_validation.outputs.version }}
          path: |
            **/build/reports/tests/**/*.html
            **/build/reports/tests/**/*.css
            **/build/reports/tests/**/*.js
            **/build/test-results/**/*.xml
            **/build/test-results/**/*.bin
            **/build/test-results/**/*.idx
          if-no-files-found: warn

      - name: Print follow-up
        run: |
          echo "Central deployment id: ${{ steps.upload.outputs.deployment_id }}"
          echo "Publishing type: ${{ needs.release_validation.outputs.publishing_type }}"
          echo "Dry run: ${{ needs.release_validation.outputs.dry_run }}"
          echo "For USER_MANAGED releases, open https://central.sonatype.com/publishing and publish after validation succeeds."

  github-release:
    name: Publish GitHub release notes
    needs: [release_validation, release]
    if: needs.release_validation.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_validation.outputs.tag }}
          RELEASE_TITLE: ${{ needs.release_validation.outputs.title }}
          RELEASE_NOTES_FILE: ${{ needs.release_validation.outputs.notes_file }}
        run: |
          TAG="${RELEASE_TAG}"
          TITLE="${RELEASE_TITLE}"
          NOTES_FILE="${RELEASE_NOTES_FILE}"
          WORKFLOW_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_COMMIT}" != "${WORKFLOW_COMMIT}" ]]; then
              echo "Tag ${TAG} points to ${TAG_COMMIT}, not workflow commit ${WORKFLOW_COMMIT}." >&2
              exit 1
            fi
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES_FILE}" --latest
            echo "Updated GitHub Release ${TAG}."
          else
            gh release create "${TAG}" --target "${WORKFLOW_COMMIT}" --title "${TITLE}" --notes-file "${NOTES_FILE}" --latest
            echo "Created GitHub Release ${TAG}."
          fi
