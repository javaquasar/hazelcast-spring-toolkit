apply plugin: 'java-test-fixtures'

// Test fixtures are internal test infrastructure shared across Boot modules.
// Suppress their variant metadata from the Gradle module file and remove the
// test-fixtures JAR artifact from the Maven publication so it is not uploaded
// to Maven Central.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

afterEvaluate {
    publishing.publications.withType(MavenPublication).configureEach { pub ->
        pub.artifacts.removeAll { it.classifier == 'test-fixtures' }
    }
}

dependencies {
    api project(':toolkit-core')
    api project(':toolkit-runtime')

    // Keep the shared module on the lowest common Spring surface so Boot 2 does not
    // inherit an accidental Spring 6 compile contract from code that is meant to be
    // shared across Boot 2 / 3 / 4.
    compileOnly 'org.springframework:spring-beans:5.3.34'
    compileOnly 'org.springframework:spring-context:5.3.34'
    compileOnly 'org.springframework:spring-aop:5.3.34'
    compileOnly 'org.hibernate.orm:hibernate-core:6.6.33.Final'
    implementation "com.hazelcast:hazelcast:${hazelcastVersion}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.hibernate.orm:hibernate-core:6.6.33.Final'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testFixturesImplementation project(':toolkit-scan-reflections')
    // Shared fixtures must stay Spring 5-compatible unless they are moved out of the
    // cross-version fixture layer. Boot 3 / 4 can still consume these fixtures because
    // the APIs used here are stable across Spring 5 and 6.
    testFixturesCompileOnly 'org.springframework:spring-context:5.3.34'
    testFixturesCompileOnly 'org.springframework:spring-beans:5.3.34'
    testFixturesCompileOnly 'org.springframework:spring-aop:5.3.34'
    testFixturesCompileOnly 'org.springframework:spring-jdbc:5.3.34'
    testFixturesCompileOnly 'org.springframework:spring-tx:5.3.34'
    testFixturesCompileOnly 'javax.cache:cache-api:1.1.1'
    testFixturesCompileOnly "org.springframework.boot:spring-boot-autoconfigure:${springBoot2Version}"
    testFixturesCompileOnly "org.springframework.boot:spring-boot:${springBoot2Version}"
    testFixturesCompileOnly "org.springframework.boot:spring-boot-test:${springBoot2Version}"
    testFixturesCompileOnly 'org.springframework.data:spring-data-jpa:2.7.18'
    testFixturesCompileOnly 'org.hibernate.orm:hibernate-core:6.6.33.Final'
    testFixturesCompileOnly 'javax.persistence:javax.persistence-api:2.2'
    testFixturesCompileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    testFixturesCompileOnly 'org.junit.jupiter:junit-jupiter-api:5.12.2'
}
